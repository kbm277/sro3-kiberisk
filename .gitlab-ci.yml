# Пайплайн GitLab: собирает пять образов и отправляет их на Docker Hub
# теми же командами Compose, что и на локальной машине.
#
# В Settings → CI/CD → Variables добавь:
#   DOCKERHUB_USER  = логин Docker Hub
#   DOCKERHUB_TOKEN = access token, тип Masked

stages:
  - build
  - test
  - push

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

.build:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

build:
  extends: .build
  stage: build
  script:
    - docker compose build
    - docker save -o images.tar $(docker compose config --images)
    - gzip images.tar
  artifacts:
    paths: [images.tar.gz]
    expire_in: 1 day

test:
  extends: .build
  stage: test
  script:
    - docker load -i images.tar.gz
    - docker compose up --no-build --pull never --wait --wait-timeout 120
    - curl -fsS http://docker:8090/ -o served.html
    - cmp site/index.html served.html
    - apk add --no-cache jq
    - curl -fsS http://docker:8081/api/risks -o risks.json
    - |
      jq -e '.service == "cyberrisk-custom" and (.risks | length > 0) and all(.risks[]; .score == .likelihood * .impact)' risks.json
    - test "$(docker compose exec -T cache redis-cli ping)" = PONG
    - test "$(docker compose exec -T db psql -U cyber -d risks -Atc 'SELECT count(*) FROM risks')" = 5
    - curl -fsS http://docker:8082/health
  after_script:
    - docker compose down -v

push:
  extends: .build
  stage: push
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker load -i images.tar.gz
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker compose push
