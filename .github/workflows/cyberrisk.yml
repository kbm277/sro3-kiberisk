name: Cyberrisk CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: TEST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start five services
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check website and risk register
        run: |
          mkdir -p public
          curl -fsS http://localhost:8090/ > public/index.html
          cmp site/index.html public/index.html
          curl -fsS http://localhost:8081/api/risks | jq -e '.service == "cyberrisk-custom" and (.risks | length > 0) and all(.risks[]; .score == .likelihood * .impact and .level == (if .score >= 12 then "высокий" elif .score >= 6 then "средний" else "низкий" end))'
      - name: Check Redis, PostgreSQL and monitor
        run: |
          test "$(docker compose exec -T cache redis-cli ping)" = PONG
          test "$(docker compose exec -T db psql -U cyber -d risks -Atc 'SELECT count(*) FROM risks')" = 5
          curl -fsS http://localhost:8082/health
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public
      - if: always()
        run: docker compose down -v
  deploy:
    name: DEPLOY
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v4
